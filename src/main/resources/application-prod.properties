# ==============================================================
# PPM BIAT — Production Profile
# Activate with: --spring.profiles.active=prod
# All secrets MUST be provided as environment variables.
# Required env vars: DB_HOST, DB_PORT, DB_NAME, DB_USER, DB_PASSWORD, JWT_SECRET
# ==============================================================

# === JPA / HIBERNATE (validate only — Flyway owns the schema) ===
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# === FLYWAY (enabled in production) ===
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# baseline-on-migrate=true: safe for both fresh DB (runs V1) and existing DB (baselines, skips V1)
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.validate-on-migrate=true
spring.flyway.out-of-order=false

# === SWAGGER (disabled in production — never expose API docs on prod) ===
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# === ACTUATOR (restrict exposure in production) ===
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true

# === SECURITY HEADERS (additional hardening) ===
# Cache control for security-sensitive responses
spring.mvc.format.date=iso

# === LOGGING (minimal in production) ===
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=ERROR
logging.level.org.pfe=INFO

# === STRUCTURED LOGGING — JSON output for Loki / ELK / cloud log aggregators ===
# Spring Boot 3.4+ built-in — no extra dependency required.
# ECS (Elastic Common Schema): compatible with Grafana Loki, Elasticsearch, Datadog.
# Each log line is a single JSON object — parsed automatically by Promtail/Fluentd.
logging.structured.format.console=ecs