# ==============================================================
# PPM BIAT — Pre-Staging (Staging) Profile
# Activate with: SPRING_PROFILES_ACTIVE=staging
# Purpose: validation environment before production promotion.
#          Mirrors production configuration as closely as possible.
#          Swagger is enabled for QA/PO validation — disable if too risky.
# Required env vars: same as prod (DB_HOST, DB_PASSWORD, JWT_SECRET, etc.)
# ==============================================================

# === JPA / HIBERNATE — Flyway owns the schema, Hibernate only validates ===
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# === FLYWAY (enabled — same migration chain as production) ===
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.validate-on-migrate=true
spring.flyway.out-of-order=false

# === SWAGGER (enabled in staging for QA/product validation) ===
# Change to false before promoting to prod if API docs must stay private
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

# === ACTUATOR ===
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true

# === LOGGING (slightly more verbose than prod for issue detection) ===
logging.level.org.springframework.security=INFO
logging.level.org.pfe=DEBUG
logging.level.org.hibernate.SQL=WARN

# === STRUCTURED LOGGING (JSON for log aggregation — Loki/Grafana compatible) ===
logging.structured.format.console=ecs