spring.application.name=PPM_project
server.port=${SERVER_PORT:8082}

# === DATASOURCE ===
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:PPM}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
# Dev default = empty (XAMPP root with no password). In prod, DB_PASSWORD env var is mandatory.
spring.datasource.password=${DB_PASSWORD:}

# === JPA / HIBERNATE ===
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.properties.hibernate.format_sql=false

# === FLYWAY (disabled in dev — Hibernate ddl-auto=update handles schema) ===
spring.flyway.enabled=false

# === FILE UPLOAD ===
file.upload.base-dir=${FILE_UPLOAD_DIR:./projects}
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# === CORS ===
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# === JWT ===
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# === ACTUATOR (health probes for Kubernetes) ===
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true
management.info.env.enabled=true