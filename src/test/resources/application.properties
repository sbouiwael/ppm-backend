# ==============================================================
# PPM — Test profile overrides
# Applied automatically for all @SpringBootTest tests.
# Uses H2 in-memory database so tests run without a MySQL instance.
# ==============================================================

# H2 in-memory datasource — replaces MySQL for integration tests
spring.datasource.url=jdbc:h2:mem:ppm_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# A fixed test-only secret — NEVER use this value outside of tests
jwt.secret=test-only-secret-key-minimum-256-bits-long-for-hmac-sha256-algorithm-ppm-biat

# Short expiry for tests
jwt.expiration-ms=3600000

# Use create-drop so tests rebuild the schema each run (no Flyway needed)
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false

# Log SQL only at DEBUG (keeps test output clean by default)
spring.jpa.show-sql=false
logging.level.org.pfe=WARN
logging.level.org.springframework.security=WARN