# ==============================================================
# PPM Backend — CI/CD Pipeline (GitHub Actions)
# Provider-agnostic: uses GHCR by default, overridable via secrets.
#
# REGISTRY:          container registry URL (default: ghcr.io)
# IMAGE_NAME:        image name          (default: <owner>/ppm-backend)
# GITOPS_TOKEN:      PAT with write access to ppm-gitops repo
#
# To switch to another registry (ECR / ACR / GCR):
#   Override the "Login to registry" step in a fork of this workflow.
#   Everything else (build, scan, promote) remains identical.
# ==============================================================

name: Backend CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'pom.xml'
      - 'Dockerfile'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'pom.xml'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/ppm-backend
  JAVA_VERSION: '17'

jobs:
  # ── 1. Tests ───────────────────────────────────────────────────────────────
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_root
          MYSQL_DATABASE: PPM_test
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -pci_root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
        ports:
          - 3306:3306

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Run tests
        run: mvn test -B -Dspring.profiles.active=test
        env:
          DB_HOST: localhost
          DB_PORT: 3306
          DB_NAME: PPM_test
          DB_USER: root
          DB_PASSWORD: ci_root
          # JWT_SECRET is overridden by src/test/resources/application.properties

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: target/surefire-reports/
          retention-days: 7

  # ── 2. Docker Build & Push ────────────────────────────────────────────────
  docker:
    name: Build & Push Docker Image
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    outputs:
      image-tag: ${{ steps.meta.outputs.version }}
      image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}

    permissions:
      contents: read
      packages: write   # required to push to GHCR

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=true

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 3. Security Scan ──────────────────────────────────────────────────────
  scan:
    name: Trivy Vulnerability Scan
    needs: docker
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write   # to upload SARIF to GitHub Security tab

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Trivy (CRITICAL + HIGH — fail on CRITICAL)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ needs.docker.outputs.image-ref }}
          format: sarif
          output: trivy-results.sarif
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true

      - name: Upload Trivy SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

  # ── 4. CodeQL Security Analysis ──────────────────────────────────────────
  codeql:
    name: CodeQL Security Analysis
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java
          queries: security-and-quality

      - name: Build for CodeQL
        run: mvn compile -B -DskipTests

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:java"

  # ── 5. Promote to test environment ────────────────────────────────────────
  promote-test:
    name: Promote → test
    needs: [docker, scan]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout GitOps repo
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/ppm-gitops
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops

      - name: Update backend image tag for test environment
        run: |
          TAG="${{ needs.docker.outputs.image-tag }}"
          FILE="gitops/charts/ppm-backend/values-test.yaml"

          # Use sed as a portable fallback (yq not always available on runners)
          sed -i "s|^  tag:.*|  tag: \"${TAG}\"|" "$FILE"

          cd gitops
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add charts/ppm-backend/values-test.yaml

          # Only commit if there is a real change
          if git diff --staged --quiet; then
            echo "No image tag change detected — skipping commit."
          else
            git commit -m "ci(backend): promote ${TAG} to test [skip ci]"
            git push
          fi