# ==============================================================
# PPM Backend - CI/CD Pipeline (GitHub Actions)
# Provider-agnostic: uses GHCR by default, overridable via secrets.
#
# REGISTRY:          container registry URL (default: ghcr.io)
# IMAGE_NAME:        image name          (default: <owner>/ppm-backend)
# GITOPS_TOKEN:      PAT with write access to ppm-gitops repo
#
# Pipeline stages (DevSecOps - SLSA-friendly):
#   test  ─┐
#          ├─> docker ─┬─> scan
#   trivy-fs ─────────┼─> sbom         ┐
#                     ├─> sign         ├─> promote-test
#                     └─> provenance   ┘
#   codeql   (parallel, non-blocking on private repos w/o GHAS)
#   quality  (parallel, mvn verify - non-blocking by design)
#
# To switch to another registry (ECR / ACR / GCR):
#   Override the "Login to registry" step in a fork of this workflow.
#   Everything else (build, scan, promote) remains identical.
# ==============================================================

name: Backend CI/CD

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'pom.xml'
      - 'Dockerfile'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'pom.xml'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/ppm-backend
  JAVA_VERSION: '17'

jobs:
  # ── 1. Tests ───────────────────────────────────────────────────────────────
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Principe du moindre privilege - ce job a seulement besoin de lire le repo
    permissions:
      contents: read

    services:
      mysql:
        image: mysql:8.0.40
        env:
          MYSQL_ROOT_PASSWORD: ci_root
          MYSQL_DATABASE: PPM_test
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -pci_root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
        ports:
          - 3306:3306

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Run tests
        run: mvn test -B -Dspring.profiles.active=test
        env:
          DB_HOST: localhost
          DB_PORT: 3306
          DB_NAME: PPM_test
          DB_USER: root
          DB_PASSWORD: ci_root
          # JWT_SECRET is overridden by src/test/resources/application.properties

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: target/surefire-reports/
          retention-days: 7

  # ── 2. Trivy filesystem scan ─────────────────────────────────────────────
  # Scan SCA + secrets sur le code source AVANT de construire l'image Docker.
  # Complementaire au scan d'image (job "scan") qui, lui, regarde la couche OS.
  # Vue source : on attrape les CVE dans pom.xml / lockfiles et les secrets
  # accidentellement commit, avant meme de payer le cout d'un build Docker.
  trivy-fs:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      security-events: write   # required to upload SARIF (Code Scanning)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Etape 1 - produire un SARIF SANS faire echouer le job.
      # On exclut target/ et .mvn/ : artefacts de build, non pertinents pour la CVE source.
      - name: Run Trivy filesystem scan (write SARIF - never fail)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs.sarif
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          skip-dirs: 'target,.mvn'

      # Etape 2 - upload SARIF dans l'onglet Security.
      # continue-on-error : si Code Scanning n'est pas active (repo prive sans GHAS),
      # on ne casse pas le pipeline - le gate strict en etape 3 prend le relai.
      - name: Upload Trivy fs SARIF to GitHub Security
        if: always() && hashFiles('trivy-fs.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

      # Etape 3 - gate STRICT sur CRITICAL uniquement.
      # On rejoue Trivy avec exit-code:1 et severity:CRITICAL pour bloquer
      # une PR qui introduit une CVE critique exploitable et corrigeable.
      - name: Fail build on CRITICAL filesystem CVEs
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: 'CRITICAL'
          exit-code: '1'
          ignore-unfixed: true
          skip-dirs: 'target,.mvn'

  # ── 3. Docker Build & Push ────────────────────────────────────────────────
  docker:
    name: Build & Push Docker Image
    # On exige test ET trivy-fs verts avant de payer le cout d'un build/push.
    needs: [test, trivy-fs]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 25

    outputs:
      image-tag: ${{ steps.meta.outputs.version }}
      # Immuable, indépendant du tag "latest" mutable — utilisé par la promotion GitOps.
      # steps.meta.outputs.version résout à "latest" (le tag raw prime sur sha), donc
      # promouvoir cette valeur = sed no-op ; on écrit le sha court à la place.
      sha-tag: ${{ steps.shatag.outputs.tag }}
      image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
      # Digest immuable - sera reutilise par sbom / sign / provenance
      # pour cibler EXACTEMENT l'image poussee, sans risque de tag reecrase.
      image-digest: ${{ steps.build.outputs.digest }}

    permissions:
      contents: read
      packages: write   # required to push to GHCR

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.0.0

      # Tag immuable = "sha-" + 7 premiers caractères du commit, identique à ce que
      # docker/metadata-action (type=sha,format=short) pousse sur le registre.
      - name: Compute immutable image tag (short sha)
        id: shatag
        run: echo "tag=sha-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6.0.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=true

      - name: Login to GHCR
        uses: docker/login-action@v4.1.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # provenance + sbom : Buildx attache des attestations OCI cote registre
      # en plus des jobs sign/provenance/sbom dedies plus bas (defense en profondeur).
      - name: Build and push
        id: build
        uses: docker/build-push-action@v7.1.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

  # ── 4. Security Scan (image) ─────────────────────────────────────────────
  # NOTE: l'image vient d'etre poussee sur GHCR par le job "docker" en mode prive.
  # Trivy doit s'authentifier a GHCR pour la tirer, sinon il echoue en 12s avec un 401
  # et n'ecrit jamais le SARIF -> l'upload casse derriere avec "Path does not exist".
  scan:
    name: Trivy Vulnerability Scan
    needs: docker
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      packages: read           # required to pull image from GHCR
      security-events: write   # required to upload SARIF (needs Code Scanning enabled in repo settings)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR (so Trivy can pull the private image)
        uses: docker/login-action@v4.1.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Etape 1 - produire le SARIF SANS faire echouer le job.
      # On retire 'exit-code' pour garantir que le fichier est ecrit
      # meme si des vulnerabilites sont detectees.
      - name: Run Trivy (write SARIF - never fail)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ needs.docker.outputs.image-ref }}
          format: sarif
          output: trivy-results.sarif
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

      # Etape 2 - upload du SARIF dans l'onglet Security.
      # 'continue-on-error' evite de casser le pipeline si Code Scanning
      # n'est pas active dans les reglages du repo (cas du repo prive sans GHAS).
      - name: Upload Trivy SARIF to GitHub Security
        if: always() && hashFiles('trivy-results.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy

      # Etape 3 - gate qualite : on rejoue Trivy avec exit-code pour bloquer
      # le build sur les CVE CRITICAL non corrigeables.
      # Sortie 'table' pour avoir un resume lisible dans les logs.
      - name: Fail build on CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ needs.docker.outputs.image-ref }}
          format: table
          severity: 'CRITICAL'
          exit-code: '1'
          ignore-unfixed: true

  # ── 5. SBOM (Software Bill of Materials) ─────────────────────────────────
  # Inventaire signe de TOUT ce qui compose l'image : libs Java (pom), libs
  # systeme (apt/apk), versions, licences. Format CycloneDX (standard ISO).
  # Indispensable pour repondre en 2s a "ai-je log4shell dans mes images de prod ?".
  # Exige par US Executive Order 14028 et EU Cyber Resilience Act.
  sbom:
    name: Generate SBOM & Attestation
    needs: docker
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      packages: write       # ecrire l'attestation OCI dans GHCR
      id-token: write       # OIDC pour signature Sigstore keyless
      attestations: write   # enregistrer l'attestation cote GitHub

    steps:
      - name: Login to GHCR
        uses: docker/login-action@v4.1.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Syft (anchore) scanne l'image produite par le job docker et genere
      # un SBOM CycloneDX JSON. On cible par digest immuable, pas par tag.
      - name: Generate SBOM (CycloneDX) via Syft
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.docker.outputs.image-digest }}
          format: cyclonedx-json
          output-file: sbom.cdx.json

      # Conserve le SBOM comme artifact telechargeable (audit / soutenance).
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          retention-days: 30

      # Signe le SBOM avec Sigstore (OIDC keyless) et l'attache a l'image
      # dans GHCR comme "referrer" OCI. Verifiable plus tard avec
      # `gh attestation verify` ou `cosign verify-attestation`.
      - name: Attest SBOM to image
        uses: actions/attest-sbom@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ needs.docker.outputs.image-digest }}
          sbom-path: sbom.cdx.json
          push-to-registry: true

  # ── 6. Cosign keyless signing ────────────────────────────────────────────
  # Signe cryptographiquement l'image avec Sigstore. Mode keyless : pas de
  # cle privee a gerer - Fulcio emet un certificat ephemere lie a l'identite
  # OIDC du workflow (repo + commit + workflow path). 10 min de validite,
  # consigne dans le journal public Rekor.
  sign:
    name: Cosign Keyless Signing
    needs: docker
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      packages: write   # ecrire la signature dans GHCR
      id-token: write   # OIDC token pour Fulcio (Sigstore CA)

    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Login to GHCR
        uses: docker/login-action@v4.1.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Signe l'image par digest (immuable). COSIGN_EXPERIMENTAL active le
      # mode keyless dans les versions anciennes ; inoffensif sur v3.x.
      - name: Sign image with Cosign (keyless)
        env:
          COSIGN_EXPERIMENTAL: '1'
        run: |
          cosign sign --yes \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.docker.outputs.image-digest }}"

  # ── 7. SLSA Build Provenance ─────────────────────────────────────────────
  # Atteste, de maniere verifiable, COMMENT l'image a ete construite :
  # builder (GitHub-hosted runner), source (repo + commit SHA), workflow,
  # materials. C'est le niveau SLSA L3 (non-falsifiable, automatise).
  # Permet a un consommateur de prouver que l'image vient bien de notre CI.
  provenance:
    name: SLSA Build Provenance
    needs: docker
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      packages: write       # ecrire l'attestation OCI dans GHCR
      id-token: write       # OIDC pour Sigstore
      attestations: write   # enregistrer l'attestation cote GitHub

    steps:
      # Auth GHCR obligatoire : attest-build-provenance avec push-to-registry:true
      # ecrit l'attestation OCI cote GHCR et exige un login docker (sinon
      # "No credentials found for registry ghcr.io").
      - name: Login to GHCR
        uses: docker/login-action@v4.1.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate build provenance attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ needs.docker.outputs.image-digest }}
          push-to-registry: true

  # ── 8. CodeQL Security Analysis ──────────────────────────────────────────
  codeql:
    name: CodeQL Security Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java
          queries: security-and-quality

      - name: Build for CodeQL
        run: mvn compile -B -DskipTests

      # 'continue-on-error' tolere le cas ou Code Scanning n'est pas active
      # dans Settings -> Code security. Pour reactiver le blocage du build :
      # 1) repo public -> Settings -> Code security -> "Enable" sur Code scanning
      # 2) repo prive  -> il faut GitHub Advanced Security (payant)
      # Puis retirer la ligne 'continue-on-error' ci-dessous.
      - name: Perform CodeQL Analysis
        continue-on-error: true
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:java"

  # ── 9. Quality (Maven verify) ────────────────────────────────────────────
  # Job qualite non-bloquant : `mvn verify -DskipTests` execute compile +
  # package + spring-boot:repackage sans relancer la suite de tests (deja
  # couverte par le job "test"). Sert de garde-fou supplementaire :
  # detecte une dependance manquante, un plugin casse, un manifest invalide.
  # Aucun plugin checkstyle/pmd/spotbugs n'est configure dans pom.xml -
  # on n'en force pas l'ajout pour ne pas generer de bruit artificiel.
  quality:
    name: Maven Quality Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Maven verify (skip tests)
        run: mvn clean verify -B -DskipTests

  # ── 10. Promote to test environment ──────────────────────────────────────
  # GitOps : on ne deploie vers l'env "test" que si TOUTE la chaine
  # supply-chain est verte (image scannee, SBOM signe, image signee,
  # provenance attestee). Cosign + attestations = preuves traçables
  # en cas d'audit ou d'incident.
  promote-test:
    name: Promote → test
    needs: [docker, scan, sbom, sign, provenance]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Principe du moindre privilege - le push vers ppm-gitops utilise GITOPS_TOKEN (PAT)
    # et non GITHUB_TOKEN, donc 'contents: read' suffit pour ce repo-ci.
    permissions:
      contents: read

    steps:
      - name: Checkout GitOps repo
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/ppm-gitops
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops

      - name: Update backend image tag for test environment
        run: |
          # Tag immuable (sha-xxxxxxx) et non "latest" : garantit un diff réel dans
          # values-test.yaml → un commit GitOps → Argo CD détecte le changement.
          TAG="${{ needs.docker.outputs.sha-tag }}"
          FILE="gitops/charts/ppm-backend/values-test.yaml"

          # Use sed as a portable fallback (yq not always available on runners)
          sed -i "s|^  tag:.*|  tag: \"${TAG}\"|" "$FILE"

          cd gitops
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add charts/ppm-backend/values-test.yaml

          # Only commit if there is a real change
          if git diff --staged --quiet; then
            echo "No image tag change detected - skipping commit."
          else
            git commit -m "ci(backend): promote ${TAG} to test [skip ci]"
            git push
          fi
